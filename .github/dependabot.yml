version: 2

updates:
    # Node dependencies (pnpm / npm ecosystem)
    - package-ecosystem: 'npm'
      directory: '/'
      target-branch: 'develop'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '08:00'
          timezone: 'America/Chihuahua'
      open-pull-requests-limit: 5
      versioning-strategy: increase
      ignore:
          # The visual certification pins Playwright to its Docker image and accepted references;
          # upgrading it is a deliberate runtime change with a reviewed visual candidate.
          - dependency-name: '@playwright/test'
          - dependency-name: 'playwright'
          - dependency-name: 'playwright-core'
      cooldown:
          default-days: 3
          semver-major-days: 30
          semver-minor-days: 7
          semver-patch-days: 3
      groups:
          # `vite` moves with Astro: a root pin older than Astro's own vite installs two copies, and
          # the Cloudflare plugin's rolldown `esmExternalRequirePlugin` from the other copy is
          # silently ignored, leaving `require("fs")` in the Worker bundle (HTTP 500).
          astro-platform:
              patterns:
                  - 'vite'
                  - 'astro'
                  - 'astro-*'
                  - '@astrojs/*'
              update-types:
                  - 'minor'
                  - 'patch'
          testing:
              patterns:
                  - '@playwright/*'
                  - '@testing-library/*'
                  - 'jest'
                  - 'jest-*'
              update-types:
                  - 'minor'
                  - 'patch'
          tooling:
              patterns:
                  - '@commitlint/*'
                  - '@eslint/*'
                  - 'eslint'
                  - 'eslint-*'
                  - 'lint-staged'
                  - 'prettier'
                  - 'prettier-*'
                  - 'sass-embedded'
                  - 'stylelint'
                  - 'stylelint-*'
                  - 'tsx'
              update-types:
                  - 'minor'
                  - 'patch'
      commit-message:
          prefix: 'chore'
          prefix-development: 'chore'
          include: 'scope'
      labels:
          - 'dependencies'
          - 'automated'

    # GitHub Actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      target-branch: 'develop'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '08:30'
          timezone: 'America/Chihuahua'
      cooldown:
          default-days: 7
      commit-message:
          prefix: 'chore'
          include: 'scope'
      labels:
          - 'dependencies'
