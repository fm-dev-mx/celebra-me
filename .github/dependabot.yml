version: 2

updates:
    # Node dependencies (pnpm / npm ecosystem)
    - package-ecosystem: 'npm'
      directory: '/'
      target-branch: 'develop'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '06:00'
      open-pull-requests-limit: 5
      versioning-strategy: increase
      cooldown:
          default-days: 2
          semver-major-days: 30
          semver-minor-days: 2
          semver-patch-days: 2
      ignore:
          - dependency-name: '*'
            update-types:
                - 'version-update:semver-major'
      commit-message:
          prefix: 'chore'
          prefix-development: 'chore'
          include: 'scope'
      labels:
          - 'dependencies'
          - 'automated'

    # GitHub Actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      target-branch: 'develop'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 7
      ignore:
          - dependency-name: '*'
            update-types:
                - 'version-update:semver-major'
      commit-message:
          prefix: 'chore'
          include: 'scope'
      labels:
          - 'dependencies'
