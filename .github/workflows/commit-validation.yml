name: Repository CI

permissions:
    contents: read
    actions: read

# The event keeps the nightly dispatch on develop and a develop push from cancelling each other.
concurrency:
    group: repository-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

on:
    workflow_dispatch:
        inputs:
            visual_mode:
                description: 'Compare all release checks or generate an owner-review candidate'
                type: choice
                options: [compare, candidate]
                default: compare
    # A main push is a merged release: `pnpm ops:release-status --target production` requires these
    # checks on the exact main SHA, which is a new merge commit nothing else validated.
    push:
        branches:
            - develop
            - main
    # Pull requests into develop (for example Dependabot updates) are validated before they land;
    # pull requests into main are release promotions.
    pull_request:
        types: [opened, synchronize, reopened]
        branches:
            - develop
            - main

# Independent tiers isolate browser and disposable database state.
# The protected Application Suite status aggregates every application result.
jobs:
    # A promotion pull request whose merge candidate holds the tree already validated on develop
    # reuses that run instead of repeating every application tier.
    evidence-reuse:
        name: Evidence reuse
        if: >-
            github.event_name == 'pull_request' &&
            github.head_ref == 'develop' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            reuse: ${{ steps.assessment.outputs.reuse }}
            source-run-id: ${{ steps.assessment.outputs.source_run_id }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  lfs: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'

            - name: Assess integration evidence for the merge candidate
              id: assessment
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_HEAD_REF: ${{ github.head_ref }}
                  PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: node scripts/ops/ci-evidence-reuse.ts

    # A develop push or pull request into develop whose browser inputs equal the head of an earlier
    # develop push with a passing browser tier inherits that evidence instead of repeating the tier.
    browser-scope:
        name: Browser scope
        # Only a develop push or a pull request into develop can inherit evidence; promotion pull
        # requests into main use evidence reuse instead, and dispatches always run the tier.
        if: >-
            github.event_name == 'push' ||
            (github.event_name == 'pull_request' && github.base_ref == 'develop')
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            browser: ${{ steps.assessment.outputs.browser }}
            source-run-id: ${{ steps.assessment.outputs.source_run_id }}
            # `deferred` only for a pull request into develop that changes no visual parity input.
            visual: ${{ steps.assessment.outputs.visual }}
            browser-parts: ${{ steps.assessment.outputs.browser_parts }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  lfs: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'

            - name: Assess browser inputs against the last passing browser tier
              id: assessment
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/ops/ci-browser-scope.ts

    policy-validation:
        name: Repository Policy
        if: github.event.inputs.visual_mode != 'candidate'
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  lfs: false

            - name: Resolve validation range
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PUSH_BEFORE_SHA: ${{ github.event.before }}
                  PUSH_HEAD_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail

                  if [ "$EVENT_NAME" = "pull_request" ]; then
                    BASE_SHA="$PR_BASE_SHA"
                    HEAD_SHA="$PR_HEAD_SHA"
                  else
                    BASE_SHA="$PUSH_BEFORE_SHA"
                    HEAD_SHA="$PUSH_HEAD_SHA"
                  fi

                  if [ -z "$HEAD_SHA" ]; then
                    echo "Unable to resolve validation head SHA"
                    exit 1
                  fi

                  if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
                    BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
                  fi

                  git cat-file -e "${BASE_SHA}^{commit}"
                  git cat-file -e "${HEAD_SHA}^{commit}"

                  echo "VALIDATION_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
                  echo "VALIDATION_HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
                  echo "Validation event: $EVENT_NAME"
                  echo "Base SHA: $BASE_SHA"
                  echo "Head SHA: $HEAD_SHA"

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate commit messages
              run: |
                  COMMITS=$(git rev-list --count "$VALIDATION_BASE_SHA..$VALIDATION_HEAD_SHA")
                  echo "Number of commits in validation range: $COMMITS"
                  if [ "$COMMITS" -eq 0 ]; then
                    echo "No commits found in validation range"
                    exit 0
                  fi
                  node scripts/validate-commits.mjs "$VALIDATION_BASE_SHA" "$VALIDATION_HEAD_SHA"

            - name: Documentation link integrity
              run: pnpm ops check-links

            - name: Markdown table readability
              run: pnpm validate:markdown-tables

            - name: Validate invitation publication transitions
              run: pnpm validate:invitation-publication-transitions -- --base "$VALIDATION_BASE_SHA" --head "$VALIDATION_HEAD_SHA"

            - name: Validate invitation note retirement
              run: pnpm validate:invitation-note-retirement -- --base "$VALIDATION_BASE_SHA" --head "$VALIDATION_HEAD_SHA"

            - name: Classify release (advisory)
              run: pnpm ops:classify-release -- --base "$VALIDATION_BASE_SHA" --head "$VALIDATION_HEAD_SHA" --output release-classification.json

            - name: Upload release classification
              uses: actions/upload-artifact@v7
              with:
                  name: release-classification-${{ github.sha }}
                  path: release-classification.json
                  if-no-files-found: error
                  retention-days: 14

    application-checks:
        name: Application / ${{ matrix.tier }}
        needs: evidence-reuse
        # A skipped or failed evidence job never blocks execution; only confirmed reuse skips a tier.
        if: >-
            !cancelled() &&
            needs.evidence-reuse.outputs.reuse != 'true' &&
            github.event.inputs.visual_mode != 'candidate'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                tier: [static, unit, database, workerd]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  lfs: false

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Content-keyed lint caches; a stale entry only re-lints the files whose content changed.
            - name: Restore lint caches
              if: matrix.tier == 'static'
              uses: actions/cache@v6
              with:
                  path: |
                      node_modules/.cache/eslint
                      node_modules/.cache/stylelint
                  key: lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.stylelintrc.json') }}-${{ github.sha }}
                  restore-keys: |
                      lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.stylelintrc.json') }}-

            # Every `ci:static` command, in parallel lanes: type check, build and the other checks.
            - name: Static checks and build
              if: matrix.tier == 'static'
              run: pnpm ci:static:parallel

            # Bundles both memories Workers for every environment without deploying or authenticating.
            - name: Memories Worker bundles
              if: matrix.tier == 'static'
              run: pnpm worker:memories:dry-run

            - name: Unit tests
              if: matrix.tier == 'unit'
              run: pnpm test

            # Builds the Cloudflare target and serves it in workerd with `wrangler dev`. The canonical
            # fixture transport stands in for Supabase; no Cloudflare account or real secret is used.
            - name: Build the Cloudflare Worker
              if: matrix.tier == 'workerd'
              env:
                  PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
              run: pnpm build:app

            - name: Serve the Worker in workerd
              if: matrix.tier == 'workerd'
              env:
                  PLAYWRIGHT_USE_CANONICAL_FIXTURES: 'true'
                  WRANGLER_SEND_METRICS: 'false'
              run: |
                  mkdir -p .tmp/workerd
                  nohup node --import tsx scripts/playwright/canonical-fixture-server.ts                       > .tmp/workerd/fixtures.log 2>&1 &
                  nohup pnpm exec wrangler dev --port 8799 --test-scheduled                       --show-interactive-dev-session=false                       --var SUPABASE_URL:http://127.0.0.1:54321                       --var PUBLIC_SUPABASE_URL:http://127.0.0.1:54321                       --var SUPABASE_ANON_KEY:workerd-fixture-not-a-credential                       --var PUBLIC_SUPABASE_ANON_KEY:workerd-fixture-not-a-credential                       --var SUPABASE_SERVICE_ROLE_KEY:workerd-fixture-not-a-credential                       --var CONTACT_WHATSAPP:5216681234567                       > .tmp/workerd/wrangler.log 2>&1 &
                  for attempt in $(seq 1 60); do
                      if curl -fsS -o /dev/null http://127.0.0.1:54321/health &&
                          curl -fsS -o /dev/null http://127.0.0.1:8799/; then
                          exit 0
                      fi
                      sleep 2
                  done
                  cat .tmp/workerd/fixtures.log .tmp/workerd/wrangler.log
                  exit 1

            - name: Check pages, headers, health and crons through the Worker
              if: matrix.tier == 'workerd'
              run: pnpm test:workerd --url http://127.0.0.1:8799 --log .tmp/workerd/wrangler.log --sha "$GITHUB_SHA"

            - name: Preserve workerd logs
              if: failure() && matrix.tier == 'workerd'
              uses: actions/upload-artifact@v7
              with:
                  name: workerd-logs
                  path: .tmp/workerd/*.log
                  include-hidden-files: true
                  if-no-files-found: ignore
                  retention-days: 3

            - name: Public RSVP disposable DB/HTTP contracts
              if: matrix.tier == 'database'
              run: pnpm test:db:rsvp-contracts

            - name: Managed disposable DB contracts
              if: matrix.tier == 'database'
              run: pnpm test:db:managed-contracts

            - name: Disposable DB pgTAP and event memories contracts
              if: matrix.tier == 'database'
              run: pnpm test:db:memories-contracts

    # Browser scope splits the checks into four Playwright shards. With complete visual parity two
    # shards run the page parity suite (`pages-<n>-of-2`) and two every other browser check
    # (`rest-<n>-of-2`); with deferred parity four shards run everything (`all-<n>-of-4`). Runs
    # without Browser scope (release promotions, dispatches and visual candidates) keep one `all` job.
    browser-validation:
        name: Application / browser${{ matrix.part != 'all' && format(' ({0})', matrix.part) || '' }}
        needs: [evidence-reuse, browser-scope]
        # A scope assessment that failed or never ran leaves its output empty, which runs the tier.
        if: >-
            !cancelled() &&
            needs.evidence-reuse.outputs.reuse != 'true' &&
            needs.browser-scope.outputs.browser != 'skip'
        outputs:
            check-outcome: ${{ steps.browser-outcome.outputs.classification }}
        strategy:
            fail-fast: false
            matrix:
                part: ${{ fromJSON(needs.browser-scope.outputs.browser-parts || '["all"]') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        container:
            image: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
        env:
            PLAYWRIGHT_USE_CANONICAL_FIXTURES: 'true'
            PLAYWRIGHT_REQUIRE_VISUAL_PREFLIGHT: 'true'
            VISUAL_PARITY_OS_IMAGE_DIGEST: sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
            VISUAL_PARITY_MODE: ${{ github.event.inputs.visual_mode || 'compare' }}
            # Shared by every shard, so the coverage job can join their capture records.
            VISUAL_PARITY_RUN_ID: ${{ github.run_id }}
        steps:
            - name: Install Git LFS for accepted references
              run: apt-get update && apt-get install -y --no-install-recommends git-lfs
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  lfs: true
            - name: Trust the isolated checkout for capture provenance
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - name: Install pnpm
              uses: pnpm/action-setup@v6
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Browser checks
              id: browser-checks
              if: github.event.inputs.visual_mode != 'candidate'
              continue-on-error: true
              # A pull request into develop that changes no visual parity input skips the complete
              # visual parity suites; the develop push, release promotions and the nightly dispatch
              # (nightly-visual-parity.yml) run them.
              env:
                  VISUAL_PARITY_DEFERRED: ${{ needs.browser-scope.outputs.visual == 'deferred' }}
                  PLAYWRIGHT_BROWSER_PART: ${{ matrix.part }}
              run: pnpm test:e2e:ci --max-failures=5 --workers=2

            # A shard skips the teardown matrix proof; this asserts everything but coverage for its
            # own captures, and `browser-visual-coverage` asserts coverage across every shard.
            - name: Prove this shard's visual captures
              id: shard-proof
              if: steps.browser-checks.outcome == 'success' && contains(matrix.part, '-of-')
              env:
                  VISUAL_PARITY_OUTPUT_ROOT: .tmp/visual-parity/compare
              run: pnpm visual:parity:shard

            - name: Preserve this shard's visual capture records
              if: steps.shard-proof.outcome == 'success'
              uses: actions/upload-artifact@v7
              with:
                  name: visual-records-${{ matrix.part }}
                  path: .tmp/visual-parity/compare/records
                  include-hidden-files: true
                  if-no-files-found: ignore
                  retention-days: 1

            - name: Classify browser outcome
              id: browser-outcome
              if: always() && github.event.inputs.visual_mode != 'candidate'
              env:
                  BROWSER_STEP_OUTCOME: ${{ steps.browser-checks.outcome }}
              run: pnpm exec tsx scripts/ops/browser-outcome.ts

            - name: Generate visual review candidate
              if: github.event.inputs.visual_mode == 'candidate'
              run: pnpm visual:parity:candidate

            - name: Preserve candidate for owner review
              if: always() && github.event.inputs.visual_mode == 'candidate'
              uses: actions/upload-artifact@v7
              with:
                  name: visual-candidate-${{ github.sha }}
                  path: |
                      .tmp/visual-parity/candidate
                      .tmp/visual-parity/candidate-references
                      .tmp/visual-parity/candidate-diffs
                  include-hidden-files: true
                  retention-days: 7

            - name: Preserve browser results and failure evidence
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: visual-failures-${{ matrix.part }}
                  path: |
                      test-results/**/*-actual.png
                      test-results/**/*-diff.png
                      test-results/**/trace.zip
                      test-results/**/error-context.md
                      test-results/**/*.json
                      .tmp/browser-outcome.json
                      .tmp/visual-parity-failure.json
                  if-no-files-found: ignore
                  retention-days: 3

            - name: Enforce browser result
              if: >-
                  github.event.inputs.visual_mode != 'candidate' &&
                  steps.browser-checks.outcome != 'success'
              run: exit 1

    # Joins the capture records of every browser shard and fails when the complete matrix of a
    # capture suite that ran is not covered. It shares the browser job prefix, so evidence reuse and
    # Browser scope require it with the browser parts; an unsharded run has no records to join.
    browser-visual-coverage:
        name: Application / browser (visual coverage)
        needs: [browser-scope, browser-validation]
        if: >-
            !cancelled() &&
            needs.browser-validation.result != 'skipped' &&
            github.event.inputs.visual_mode != 'candidate'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        # The merge script uses Node built-ins only: no dependency install on the critical path.
        steps:
            - name: Checkout the merge script
              uses: actions/checkout@v7
              with:
                  lfs: false
                  sparse-checkout: scripts/ops/visual-shard-merge.ts
                  sparse-checkout-cone-mode: false
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'
            - name: Collect shard capture records
              uses: actions/download-artifact@v8
              with:
                  pattern: visual-records-*
                  path: .tmp/visual-records
                  merge-multiple: true
            - name: Require complete visual coverage across shards
              env:
                  VISUAL_PARITY_RUN_ID: ${{ github.run_id }}
                  # The `pages` and `rest` shards must between them have started both capture suites.
                  VISUAL_SHARD_PARTS: ${{ needs.browser-scope.outputs.browser-parts }}
              run: node scripts/ops/visual-shard-merge.ts .tmp/visual-records

    # Guest memories flow on every device project (Chromium, WebKit and in-app user agents)
    # against the canonical memory space; guest APIs and the upload Worker are mocked. It runs
    # beside the visual checks instead of after them, under the same browser-tier conditions.
    browser-memories:
        name: Application / browser memories
        needs: [evidence-reuse, browser-scope]
        if: >-
            !cancelled() &&
            needs.evidence-reuse.outputs.reuse != 'true' &&
            needs.browser-scope.outputs.browser != 'skip' &&
            github.event.inputs.visual_mode != 'candidate'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        container:
            image: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
        env:
            PLAYWRIGHT_USE_CANONICAL_FIXTURES: 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  lfs: false
            - name: Install pnpm
              uses: pnpm/action-setup@v6
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Memories guest browser checks
              run: pnpm test:e2e:memories --max-failures=5 --workers=2

            - name: Preserve memories failure evidence
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: memories-failures
                  path: |
                      test-results/**/trace.zip
                      test-results/**/error-context.md
                  if-no-files-found: ignore
                  retention-days: 3

    application-validation:
        name: Application Suite
        runs-on: ubuntu-24.04
        needs:
            [
                evidence-reuse,
                policy-validation,
                application-checks,
                browser-validation,
                browser-visual-coverage,
                browser-memories,
                browser-scope,
            ]
        if: always() && github.event.inputs.visual_mode != 'candidate'
        steps:
            - name: Require every application tier to pass
              env:
                  APPLICATION_RESULT: ${{ needs.application-checks.result }}
                  BROWSER_RESULT: ${{ needs.browser-validation.result }}
                  COVERAGE_RESULT: ${{ needs.browser-visual-coverage.result }}
                  MEMORIES_RESULT: ${{ needs.browser-memories.result }}
                  POLICY_RESULT: ${{ needs.policy-validation.result }}
                  EVIDENCE_REUSE: ${{ needs.evidence-reuse.outputs.reuse }}
                  BROWSER_SCOPE: ${{ needs.browser-scope.outputs.browser }}
              run: |
                  test "$POLICY_RESULT" = success
                  if [ "$EVIDENCE_REUSE" = true ]; then
                    # Reused integration evidence stands in for tiers that must not have executed.
                    test "$APPLICATION_RESULT" = skipped && test "$BROWSER_RESULT" = skipped && test "$MEMORIES_RESULT" = skipped
                    test "$COVERAGE_RESULT" = skipped
                  elif [ "$BROWSER_SCOPE" = skip ]; then
                    # Browser inputs are byte-identical to an earlier develop push whose browser tier passed.
                    test "$APPLICATION_RESULT" = success && test "$BROWSER_RESULT" = skipped && test "$MEMORIES_RESULT" = skipped
                    test "$COVERAGE_RESULT" = skipped
                  else
                    test "$APPLICATION_RESULT" = success && test "$BROWSER_RESULT" = success && test "$MEMORIES_RESULT" = success
                    test "$COVERAGE_RESULT" = success
                  fi
