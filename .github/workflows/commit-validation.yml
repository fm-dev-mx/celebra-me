name: Commit Validation ADU

permissions:
    contents: read

on:
    push:
        branches:
            - develop
    pull_request:
        types: [opened, synchronize, reopened]
        branches:
            - main

jobs:
    validate-commits:
        name: Validate PR Commits
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Resolve validation range
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PUSH_BEFORE_SHA: ${{ github.event.before }}
                  PUSH_HEAD_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail

                  if [ "$EVENT_NAME" = "pull_request" ]; then
                    BASE_SHA="$PR_BASE_SHA"
                    HEAD_SHA="$PR_HEAD_SHA"
                  else
                    BASE_SHA="$PUSH_BEFORE_SHA"
                    HEAD_SHA="$PUSH_HEAD_SHA"
                  fi

                  if [ -z "$HEAD_SHA" ]; then
                    echo "Unable to resolve validation head SHA"
                    exit 1
                  fi

                  if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
                    BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
                  fi

                  git cat-file -e "${BASE_SHA}^{commit}"
                  git cat-file -e "${HEAD_SHA}^{commit}"

                  echo "VALIDATION_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
                  echo "VALIDATION_HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
                  echo "Validation event: $EVENT_NAME"
                  echo "Base SHA: $BASE_SHA"
                  echo "Head SHA: $HEAD_SHA"

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24.14.1'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate commit messages
              run: |
                  COMMITS=$(git rev-list --count "$VALIDATION_BASE_SHA..$VALIDATION_HEAD_SHA")
                  echo "Number of commits in validation range: $COMMITS"
                  if [ "$COMMITS" -eq 0 ]; then
                    echo "No commits found in validation range"
                    exit 0
                  fi
                  node scripts/validate-commits.mjs "$VALIDATION_BASE_SHA" "$VALIDATION_HEAD_SHA"

            - name: Documentation link integrity
              run: pnpm ops check-links

            - name: Install Playwright browser
              run: pnpm exec playwright install --with-deps chromium

            - name: Required validation suite
              run: pnpm run ci
