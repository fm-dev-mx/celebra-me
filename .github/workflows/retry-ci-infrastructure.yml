name: Retry CI Infrastructure Failure
# DEFAULT_BRANCH_INSTALL_REQUIRED: workflow_run listeners execute from the default branch.

permissions:
    actions: write
    contents: read

on:
    workflow_run:
        workflows: ['Repository CI']
        types: [completed]

jobs:
    retry:
        name: Retry one confirmed infrastructure failure
        if: >-
            github.event.workflow_run.conclusion == 'failure' &&
            github.event.workflow_run.run_attempt == 1 &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout trusted retry classifier
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'

            - name: Confirm post-test artifact infrastructure failure
              id: classification
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
                  RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
              run: node --experimental-strip-types scripts/ops/ci-infrastructure-retry.ts

            - name: Retry failed jobs once
              if: steps.classification.outputs.should_retry == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
              run: gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
