name: Post-deploy Smoke

permissions:
    contents: read
    statuses: write

on:
    repository_dispatch:
        types:
            - 'vercel.deployment.ready'
            - 'vercel.deployment.promoted'

# `ready` and `promoted` are different checks; a `ready` dispatch for the same ref must not cancel
# the Production smoke that `promoted` started.
concurrency:
    group: post-deploy-smoke-${{ github.event.action }}-${{ github.event.client_payload.environment }}-${{ github.event.client_payload.git.ref }}
    cancel-in-progress: true

jobs:
    preview-smoke:
        name: Vercel preview smoke
        if: >-
            (github.event.action == 'vercel.deployment.ready' &&
             github.event.client_payload.environment == 'preview' &&
             github.event.client_payload.git.ref == 'develop')
        environment: Preview
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            VERCEL_DISPATCH_EVENT: ${{ github.event.action }}
            VERCEL_DISPATCH_ENVIRONMENT: ${{ github.event.client_payload.environment }}
            VERCEL_DISPATCH_PROJECT_ID: ${{ github.event.client_payload.project.id }}
            VERCEL_DISPATCH_EXPECTED_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
            VERCEL_DISPATCH_DEPLOYMENT_ID: ${{ github.event.client_payload.id }}
            VERCEL_DISPATCH_URL: ${{ github.event.client_payload.url }}
            VERCEL_DISPATCH_COMMIT_SHA: ${{ github.event.client_payload.git.sha }}
            VERCEL_DISPATCH_GIT_REF: ${{ github.event.client_payload.git.ref }}
            PLAYWRIGHT_ALLOW_PREVIEW_FIXTURE_PROVISIONING: 'false'
            PLAYWRIGHT_ALLOW_PREVIEW_PUBLICATION: 'false'
            PLAYWRIGHT_PREVIEW_DEBUG_ARTIFACTS: 'false'
            PLAYWRIGHT_PREVIEW_SUPABASE_URL: ${{ secrets.PLAYWRIGHT_PREVIEW_SUPABASE_URL }}
            VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
            PREVIEW_DB_URL: ${{ secrets.PREVIEW_DB_URL }}
            PREVIEW_PUBLIC_ROUTES_MANIFEST: .tmp/playwright/preview-public-routes.json

        steps:
            - name: Checkout exact deployment SHA
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.client_payload.git.sha }}

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate dispatch scope and correlation
              run: pnpm ops:post-deploy -- validate

            - name: Publish Vercel deployment check
              # Official Node 24 runtime update from vercel/repository-dispatch#18.
              uses: vercel/repository-dispatch/actions/status@44f4d342ebc265c58167a2aa77d5a0d5a6eb20fd
              with:
                  name: Vercel - celebra-me ${{ env.POST_DEPLOY_ENVIRONMENT }} smoke

            - name: Verify serving build identity
              run: |
                  served=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"                       "$POST_DEPLOY_BASE_URL/api/health" | jq -r '.build.commitSha // empty')
                  if [ "$served" != "$POST_DEPLOY_COMMIT_SHA" ]; then
                      echo "Serving build reports '${served:-unreported}', expected $POST_DEPLOY_COMMIT_SHA." >&2
                      exit 1
                  fi

            - name: Verify published invitation images
              env:
                  MEDIA_VERIFY_REPORT: .tmp/media-verify/preview-media-verification.json
              run: |
                  mkdir -p "$(dirname "$MEDIA_VERIFY_REPORT")"
                  set +e
                  # --silent keeps the pnpm banner out of the JSON report.
                  pnpm --silent invitation:media:verify -- --target preview --all --json > "$MEDIA_VERIFY_REPORT"
                  status=$?
                  set -e
                  # Package images the Preview DB has not received yet are a content backlog, not a
                  # delivery failure: list them, do not fail. `pnpm dbs` owns the next command.
                  if jq -e '(.summary.pendingPublish // 0) > 0' "$MEDIA_VERIFY_REPORT" > /dev/null 2>&1; then
                      jq -r '
                          "### Preview images pending publication: \(.summary.pendingPublish)",
                          "",
                          "| Route | Asset |",
                          "| --- | --- |",
                          (.rows[] | select(.classification == "PENDING_PUBLISH") | "| \(.route) | \(.assetKey) |")
                      ' "$MEDIA_VERIFY_REPORT" | tee -a "$GITHUB_STEP_SUMMARY"
                  fi
                  if [ "$status" -ne 0 ]; then
                      {
                          echo "### Preview media verification failed (exit $status)"
                          echo
                          if jq -e '.rows | type == "array"' "$MEDIA_VERIFY_REPORT" > /dev/null 2>&1; then
                              # Report rows carry only routes, asset keys, redacted URLs, and fixed reasons.
                              jq -r '
                                  ([.rows[] | select(.classification != "HEALTHY" and .classification != "PENDING_PUBLISH")]) as $failed
                                  | "Invitations: \(.summary.invitations), assets: \(.summary.assets), failures: \(.summary.failures)",
                                    "",
                                    "| Route | Asset | Classification | Reasons |",
                                    "| --- | --- | --- | --- |",
                                    ($failed[:50][] | "| \(.route) | \(.assetKey) | \(.classification) | \(.reasons | join("; ") | gsub("[|]"; "/")) |"),
                                    (if ($failed | length) > 50 then "", "_\(($failed | length) - 50) more failures in the media-verification artifact._" else empty end)
                              ' "$MEDIA_VERIFY_REPORT"
                          else
                              echo "No JSON report was produced; see the step log for the error."
                          fi
                      } | tee -a "$GITHUB_STEP_SUMMARY"
                  fi
                  exit "$status"

            - name: Upload media verification report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: preview-media-verification-${{ github.event.client_payload.git.sha }}
                  path: .tmp/media-verify/preview-media-verification.json
                  if-no-files-found: ignore
                  include-hidden-files: true
                  retention-days: 7

            - name: Install Preview browser
              run: pnpm exec playwright install --with-deps chromium

            - name: Run public Preview smoke
              env:
                  PLAYWRIGHT_BASE_URL: ${{ env.POST_DEPLOY_BASE_URL }}
              run: |
                  export PLAYWRIGHT_APPROVED_PREVIEW_DEPLOYMENT_HOST="${POST_DEPLOY_BASE_URL#https://}"
                  pnpm exec tsx scripts/invitation/preview-public-routes.ts "$PREVIEW_PUBLIC_ROUTES_MANIFEST"
                  pnpm test:e2e:preview:public

    smoke:
        name: Vercel post-deploy smoke
        if: >-
            (github.event.action == 'vercel.deployment.promoted' &&
             github.event.client_payload.environment == 'production')
        environment: Production
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout exact deployment SHA
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.client_payload.git.sha }}

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate dispatch scope and correlation
              env:
                  VERCEL_DISPATCH_EVENT: ${{ github.event.action }}
                  VERCEL_DISPATCH_ENVIRONMENT: ${{ github.event.client_payload.environment }}
                  VERCEL_DISPATCH_PROJECT_ID: ${{ github.event.client_payload.project.id }}
                  VERCEL_DISPATCH_EXPECTED_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
                  VERCEL_DISPATCH_DEPLOYMENT_ID: ${{ github.event.client_payload.id }}
                  VERCEL_DISPATCH_URL: ${{ github.event.client_payload.url }}
                  VERCEL_DISPATCH_COMMIT_SHA: ${{ github.event.client_payload.git.sha }}
                  VERCEL_DISPATCH_GIT_REF: ${{ github.event.client_payload.git.ref }}
              run: pnpm ops:post-deploy -- validate

            - name: Publish Vercel deployment check
              # Official Node 24 runtime update from vercel/repository-dispatch#18.
              uses: vercel/repository-dispatch/actions/status@44f4d342ebc265c58167a2aa77d5a0d5a6eb20fd
              with:
                  name: Vercel - celebra-me ${{ env.POST_DEPLOY_ENVIRONMENT }} smoke

            - name: Run Production HTTP smoke
              env:
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
                  VERCEL_DISPATCH_EVENT: ${{ github.event.action }}
                  VERCEL_DISPATCH_PROJECT_ID: ${{ github.event.client_payload.project.id }}
                  VERCEL_DISPATCH_EXPECTED_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
                  VERCEL_DISPATCH_GIT_REF: ${{ github.event.client_payload.git.ref }}
              run: pnpm ops:post-deploy -- production

            - name: Verify Production image delivery
              env:
                  PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
              run: pnpm invitation:media:verify -- --target production --all --origin https://www.celebra-me.com --json
