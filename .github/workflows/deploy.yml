name: Cloudflare Preview Deploy

# Builds the Cloudflare target, uploads an immutable Worker version tagged with the commit SHA,
# smokes that version behind Cloudflare Access, and only then routes traffic to it. Once the stable
# host serves the commit, it verifies the published images and runs read-only browser checks.
# Evidence: a GitHub Deployment (environment Preview, URL = the version URL) and the commit status
# `Cloudflare - celebra-me preview smoke`, both read by `pnpm ops:release-status`.

permissions:
    contents: read
    deployments: write
    statuses: write

on:
    push:
        branches:
            - develop
    workflow_dispatch:

# Versions are immutable; deployments of the same Worker stay sequential and are never cancelled
# mid-flight, so a smoked version is always the one routed.
concurrency:
    group: cloudflare-preview-deploy
    cancel-in-progress: false

env:
    SMOKE_CONTEXT: Cloudflare - celebra-me preview smoke
    PREVIEW_WORKER_URL: https://celebra-me-preview.celebra-me-com.workers.dev

jobs:
    preview:
        name: Cloudflare preview deploy
        runs-on: ubuntu-latest
        timeout-minutes: 25
        environment:
            name: Preview
            url: ${{ steps.upload.outputs.version_url }}
        env:
            GH_TOKEN: ${{ github.token }}
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            CLOUDFLARE_ENV: preview

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Publish pending smoke status
              run: |
                  gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
                      -f state=pending \
                      -f context="$SMOKE_CONTEXT" \
                      -f description="Preview Worker version pending" \
                      -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

            - name: Build Cloudflare target
              env:
                  CELEBRA_DEPLOY_ENV: preview
                  BASE_URL: ${{ env.PREVIEW_WORKER_URL }}
                  PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
                  PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
                  PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
                  PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
                  PUBLIC_META_PIXEL_ENABLED: ${{ vars.PUBLIC_META_PIXEL_ENABLED }}
              run: pnpm build:app

            - name: Create GitHub deployment
              id: deployment
              run: |
                  id=$(jq -n --arg ref "$GITHUB_SHA" '{
                      ref: $ref,
                      environment: "Preview",
                      auto_merge: false,
                      required_contexts: [],
                      transient_environment: false,
                      production_environment: false,
                      description: "Cloudflare Preview Worker"
                  }' | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
                  echo "id=$id" >> "$GITHUB_OUTPUT"
                  gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
                      -f state=in_progress \
                      -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                      -f description="Uploading Worker version" > /dev/null

            - name: Upload Worker version
              id: upload
              run: |
                  pnpm exec wrangler versions upload --env preview \
                      --tag "$GITHUB_SHA" \
                      --message "develop ${GITHUB_SHA:0:9} (run $GITHUB_RUN_ID)" | tee .tmp-versions-upload.log
                  version_id=$(grep -oE 'Worker Version ID: [0-9a-f-]+' .tmp-versions-upload.log | head -n1 | awk '{print $4}')
                  version_url=$(grep -oE 'https://[a-z0-9-]+\.celebra-me-com\.workers\.dev' .tmp-versions-upload.log | head -n1)
                  if [ -z "$version_id" ] || [ -z "$version_url" ]; then
                      echo "Could not read the version id or its preview URL from the upload output." >&2
                      exit 1
                  fi
                  echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
                  echo "version_url=$version_url" >> "$GITHUB_OUTPUT"

            - name: Smoke the uploaded version
              env:
                  CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
                  CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
              run: |
                  pnpm ops:cloudflare:preview:smoke -- \
                      --url "${{ steps.upload.outputs.version_url }}" \
                      --sha "$GITHUB_SHA" \
                      --version-id "${{ steps.upload.outputs.version_id }}"

            - name: Route traffic to the smoked version
              run: |
                  pnpm exec wrangler versions deploy --env preview -y \
                      --message "develop ${GITHUB_SHA:0:9}" \
                      "${{ steps.upload.outputs.version_id }}@100%"
                  pnpm exec wrangler triggers deploy --env preview

            - name: Verify the stable host serves the release
              env:
                  CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
                  CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
              run: |
                  # Routing propagates to the stable host a few seconds after the
                  # triggers deploy, so poll for up to ~90 s before failing.
                  served=""
                  for attempt in $(seq 1 18); do
                      served=$(curl -fsS \
                          -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
                          -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
                          -H "Cache-Control: no-cache" \
                          "$PREVIEW_WORKER_URL/api/health" | jq -r '.build.commitSha // empty') || served=""
                      if [ "$served" = "$GITHUB_SHA" ]; then
                          echo "Stable host serves $GITHUB_SHA (attempt $attempt)."
                          exit 0
                      fi
                      echo "Attempt $attempt: stable host reports '${served:-unreported}', waiting for $GITHUB_SHA."
                      sleep 5
                  done
                  echo "Stable host reports '${served:-unreported}', expected $GITHUB_SHA." >&2
                  exit 1

            - name: Verify published invitation images
              env:
                  MEDIA_VERIFY_REPORT: .tmp/media-verify/preview-media-verification.json
                  PLAYWRIGHT_ALLOW_PREVIEW_FIXTURE_PROVISIONING: 'false'
                  PLAYWRIGHT_ALLOW_PREVIEW_PUBLICATION: 'false'
                  PLAYWRIGHT_PREVIEW_DEBUG_ARTIFACTS: 'false'
                  PLAYWRIGHT_PREVIEW_SUPABASE_URL: ${{ secrets.PLAYWRIGHT_PREVIEW_SUPABASE_URL }}
                  PREVIEW_DB_URL: ${{ secrets.PREVIEW_DB_URL }}
              run: |
                  mkdir -p "$(dirname "$MEDIA_VERIFY_REPORT")"
                  set +e
                  # --silent keeps the pnpm banner out of the JSON report.
                  pnpm --silent invitation:media:verify -- --target preview --all --json > "$MEDIA_VERIFY_REPORT"
                  status=$?
                  set -e
                  # Package images the Preview DB has not received yet are a content backlog, not a
                  # delivery failure: list them, do not fail. `pnpm dbs` owns the next command.
                  if jq -e '(.summary.pendingPublish // 0) > 0' "$MEDIA_VERIFY_REPORT" > /dev/null 2>&1; then
                      jq -r '
                          "### Preview images pending publication: \(.summary.pendingPublish)",
                          "",
                          "| Route | Asset |",
                          "| --- | --- |",
                          (.rows[] | select(.classification == "PENDING_PUBLISH") | "| \(.route) | \(.assetKey) |")
                      ' "$MEDIA_VERIFY_REPORT" | tee -a "$GITHUB_STEP_SUMMARY"
                  fi
                  if [ "$status" -ne 0 ]; then
                      {
                          echo "### Preview media verification failed (exit $status)"
                          echo
                          if jq -e '.rows | type == "array"' "$MEDIA_VERIFY_REPORT" > /dev/null 2>&1; then
                              # Report rows carry only routes, asset keys, redacted URLs, and fixed reasons.
                              jq -r '
                                  ([.rows[] | select(.classification != "HEALTHY" and .classification != "PENDING_PUBLISH")]) as $failed
                                  | "Invitations: \(.summary.invitations), assets: \(.summary.assets), failures: \(.summary.failures)",
                                    "",
                                    "| Route | Asset | Classification | Reasons |",
                                    "| --- | --- | --- | --- |",
                                    ($failed[:50][] | "| \(.route) | \(.assetKey) | \(.classification) | \(.reasons | join("; ") | gsub("[|]"; "/")) |"),
                                    (if ($failed | length) > 50 then "", "_\(($failed | length) - 50) more failures in the media-verification artifact._" else empty end)
                              ' "$MEDIA_VERIFY_REPORT"
                          else
                              echo "No JSON report was produced; see the step log for the error."
                          fi
                      } | tee -a "$GITHUB_STEP_SUMMARY"
                  fi
                  exit "$status"

            - name: Upload media verification report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: preview-media-verification-${{ github.sha }}
                  path: .tmp/media-verify/preview-media-verification.json
                  if-no-files-found: ignore
                  include-hidden-files: true
                  retention-days: 7

            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium

            # Read-only browser checks on the stable host, after it serves this commit. Both keep
            # every mutation guard false and never provision or publish.
            - name: Probe public invitation content
              env:
                  PLAYWRIGHT_BASE_URL: ${{ env.PREVIEW_WORKER_URL }}
                  PLAYWRIGHT_PREVIEW_SUPABASE_URL: ${{ secrets.PLAYWRIGHT_PREVIEW_SUPABASE_URL }}
                  CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
                  CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
                  PLAYWRIGHT_ALLOW_PREVIEW_FIXTURE_PROVISIONING: 'false'
                  PLAYWRIGHT_ALLOW_PREVIEW_PUBLICATION: 'false'
                  PLAYWRIGHT_PREVIEW_DEBUG_ARTIFACTS: 'false'
                  # One invitation per event type at one viewport keeps the probe near one minute.
                  PREVIEW_CONTENT_PROBE: event-types
              run: pnpm test:e2e:preview:public

            - name: Check the authenticated dashboard
              env:
                  PLAYWRIGHT_BASE_URL: ${{ env.PREVIEW_WORKER_URL }}
                  PLAYWRIGHT_PREVIEW_SUPABASE_URL: ${{ secrets.PLAYWRIGHT_PREVIEW_SUPABASE_URL }}
                  CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
                  CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
                  PLAYWRIGHT_HOST_LOGIN: ${{ secrets.PLAYWRIGHT_HOST_LOGIN }}
                  PLAYWRIGHT_HOST_PASSWORD: ${{ secrets.PLAYWRIGHT_HOST_PASSWORD }}
                  PLAYWRIGHT_PREVIEW_INVITATION_ID: ${{ secrets.PLAYWRIGHT_PREVIEW_INVITATION_ID }}
                  PLAYWRIGHT_ALLOW_PREVIEW_FIXTURE_PROVISIONING: 'false'
                  PLAYWRIGHT_ALLOW_PREVIEW_PUBLICATION: 'false'
                  PLAYWRIGHT_PREVIEW_DEBUG_ARTIFACTS: 'false'
              run: |
                  # The Preview account secrets are optional: without them the check is skipped
                  # and the run summary says so, instead of failing the deploy.
                  if [ -z "$PLAYWRIGHT_HOST_LOGIN" ] || [ -z "$PLAYWRIGHT_HOST_PASSWORD" ] || [ -z "$PLAYWRIGHT_PREVIEW_INVITATION_ID" ]; then
                      {
                          echo "### Authenticated Preview check skipped"
                          echo
                          echo "Add the repository secrets PLAYWRIGHT_HOST_LOGIN, PLAYWRIGHT_HOST_PASSWORD and PLAYWRIGHT_PREVIEW_INVITATION_ID to enable it."
                      } | tee -a "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  pnpm test:e2e:preview

            - name: Record success
              run: |
                  gh api "repos/$GITHUB_REPOSITORY/deployments/${{ steps.deployment.outputs.id }}/statuses" \
                      -f state=success \
                      -f environment_url="${{ steps.upload.outputs.version_url }}" \
                      -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                      -f description="Version ${{ steps.upload.outputs.version_id }} routed" > /dev/null
                  gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
                      -f state=success \
                      -f context="$SMOKE_CONTEXT" \
                      -f description="Preview Worker smoke passed" \
                      -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

            - name: Record failure
              if: failure() || cancelled()
              run: |
                  if [ -n "${{ steps.deployment.outputs.id }}" ]; then
                      gh api "repos/$GITHUB_REPOSITORY/deployments/${{ steps.deployment.outputs.id }}/statuses" \
                          -f state=failure \
                          -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                          -f description="Preview Worker deploy failed" > /dev/null || true
                  fi
                  gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
                      -f state=failure \
                      -f context="$SMOKE_CONTEXT" \
                      -f description="Preview Worker smoke failed" \
                      -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null || true
