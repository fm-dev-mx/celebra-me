name: Deploy CI-approved Preview

permissions:
    contents: read

on:
    workflow_run:
        workflows: ['Repository CI']
        types: [completed]

concurrency:
    group: deploy-preview-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: true

jobs:
    deploy:
        name: Deploy approved Preview
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'develop' &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-24.04
        outputs:
            url: ${{ steps.deploy.outputs.url }}
            host: ${{ steps.deploy.outputs.host }}
        env:
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
            RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        steps:
            - name: Checkout exact CI-approved SHA
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.RELEASE_SHA }}

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Require scoped Vercel credentials
              run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"

            - name: Pull Preview configuration
              run: pnpm dlx vercel@59.25.4 pull --yes --environment=preview --token="$VERCEL_TOKEN"

            - name: Build Preview once
              run: pnpm dlx vercel@59.25.4 build --token="$VERCEL_TOKEN"

            - name: Deploy prebuilt Preview
              id: deploy
              run: |
                  set -euo pipefail
                  URL="$(pnpm dlx vercel@59.25.4 deploy --prebuilt --yes --token="$VERCEL_TOKEN" | tail -n 1)"
                  case "$URL" in
                    https://*.vercel.app) ;;
                    *) echo "Vercel returned an invalid Preview URL"; exit 1 ;;
                  esac
                  echo "url=$URL" >> "$GITHUB_OUTPUT"
                  echo "host=${URL#https://}" >> "$GITHUB_OUTPUT"
                  echo "## Preview deployment" >> "$GITHUB_STEP_SUMMARY"
                  echo "- SHA: \`$RELEASE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "- URL: $URL" >> "$GITHUB_STEP_SUMMARY"

            - name: Classify deployment failure
              if: failure()
              run: |
                  echo 'Primary cause: `DEPLOY`' >> "$GITHUB_STEP_SUMMARY"

    smoke:
        name: Vercel - celebra-me preview smoke
        needs: deploy
        runs-on: ubuntu-24.04
        env:
            PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.url }}
            PLAYWRIGHT_APPROVED_PREVIEW_DEPLOYMENT_HOST: ${{ needs.deploy.outputs.host }}
            PLAYWRIGHT_ALLOW_PREVIEW_FIXTURE_PROVISIONING: 'false'
            PLAYWRIGHT_ALLOW_PREVIEW_PUBLICATION: 'false'
            PLAYWRIGHT_PREVIEW_DEBUG_ARTIFACTS: 'false'
            PLAYWRIGHT_PREVIEW_SUPABASE_URL: ${{ secrets.PLAYWRIGHT_PREVIEW_SUPABASE_URL }}
            VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
            PREVIEW_DB_URL: ${{ secrets.PREVIEW_DB_URL }}
            PREVIEW_PUBLIC_ROUTES_MANIFEST: .tmp/playwright/preview-public-routes.json
        steps:
            - name: Checkout deployed SHA
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.14.1'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Preview browser
              run: pnpm exec playwright install --with-deps chromium

            - name: Run public Preview smoke
              run: |
                  pnpm exec tsx scripts/invitation/preview-public-routes.ts "$PREVIEW_PUBLIC_ROUTES_MANIFEST"
                  pnpm test:e2e:preview:public

            - name: Classify smoke failure
              if: failure()
              run: |
                  echo 'Primary cause: `SMOKE`' >> "$GITHUB_STEP_SUMMARY"
