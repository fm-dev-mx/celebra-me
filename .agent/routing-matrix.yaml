# Celebra-me — Context Routing Matrix (SSOT)
# Select every route matching the touched surfaces and apply its rules.
# Load only the skills/procedures needed for the task; related skills do not trigger each other.
# Bootstrap safeguards always apply.
---
version: '1.1.0'
updated: '2026-09-04'

bootstrap:
    rules:
        - '.agent/rules/gatekeeper.md'
        - '.agent/rules/git-safety.md'

routes:
    - task_type: 'visual_ui'
      description: 'Composition, typography, or visual design; add the matching surface route'
      skills:
          - 'frontend-design'

    - task_type: 'dashboard_styling'
      description: 'Dashboard SCSS, tokens, forms, modals, or responsive layout'
      rules:
          - '.agent/rules/dashboard-styling.md'

    - task_type: 'theme_architecture'
      description: 'Invitation theme tokens, presets, variants, CSS delivery, or isolation contracts'
      rules:
          - '.agent/rules/invitation-preset-source-of-truth.md'
      skills:
          - 'theme-architecture'
          - 'theme-architecture-governance'
      docs:
          - 'docs/domains/theme/architecture.md'

    - task_type: 'invitation_motion'
      description: 'Invitation animation, reveals, transitions, or reduced-motion behavior'
      skills:
          - 'animation-motion'

    - task_type: 'invitation_rhythm'
      description: 'Invitation section flow, tonal bands, or intersection cadence'
      skills:
          - 'invitation-rhythm'

    - task_type: 'design_reference_redesign'
      description: 'Visual redesign requiring interpretation of supplied or cited references'
      rules:
          - '.agent/rules/agent-routing.md'
      skills:
          - 'frontend-design'
          - 'design-reference-to-build'
      briefs:
          - '.agent/briefs/celebra-me.md'

    - task_type: 'backend_api'
      description: 'API routes, server validation, or backend service/repository changes'
      rules:
          - '.agent/rules/api-contracts.md'
          - '.agent/rules/auth-session.md'
          - '.agent/rules/database.md'
      skills:
          - 'backend-engineering'

    - task_type: 'astro_rendering'
      description: 'Astro SSR, hydration, content loading, or image delivery'
      skills:
          - 'astro-patterns'

    - task_type: 'demo_content'
      description: 'Demo-only data transforms or cross-section demo date consistency'
      skills:
          - 'demo-content-consistency'

    - task_type: 'database_ops'
      description: 'Supabase operations or migrations; select parity/SQL patch routes only when needed'
      rules:
          - '.agent/rules/database.md'
      skills:
          - 'supabase'
      docs:
          - 'docs/database-workflow.md'
          - 'docs/env-workflow.md'

    - task_type: 'database_query_design'
      description: 'Postgres query plans, indexes, locking, or schema design'
      rules:
          - '.agent/rules/database.md'
      skills:
          - 'supabase-postgres'

    - task_type: 'database_parity'
      description: 'Branch migration parity or database-sensitive release validation'
      rules:
          - '.agent/rules/database.md'
      skills:
          - 'database-parity'

    - task_type: 'production_sql_authoring'
      description: 'Author or review manual SQL patch artifacts; does not authorize execution'
      rules:
          - '.agent/rules/database.md'
          - '.agent/rules/manual-sql-manifest.md'
      skills:
          - 'production-sql-patches'

    - task_type: 'documentation_governance'
      description: 'Documentation updates, link integrity, or instruction-system alignment'
      rules:
          - '.agent/rules/workflow.md'
      skills:
          - 'system-doc-alignment'

    - task_type: 'testing_qa'
      description: 'Automated tests or regression coverage; add accessibility/metadata only if affected'
      skills:
          - 'testing'

    - task_type: 'accessibility'
      description: 'Keyboard, focus, semantics, contrast, announcements, or accessible interaction'
      skills:
          - 'accessibility'

    - task_type: 'seo_metadata'
      description: 'Open Graph, canonical URLs, social previews, or structured metadata'
      skills:
          - 'seo-metadata'

    - task_type: 'copywriting'
      description: 'Write or revise Spanish invitation, marketing, or product copy'
      skills:
          - 'copywriting-es'

    - task_type: 'error_remediation'
      description: 'Command, test, or build failure diagnosis and bounded correction'
      skills:
          - 'error-remediation'

    - task_type: 'git_branch_lane'
      description: 'Branch promotion/sync or release preparation; parity is selected by the skill'
      skills:
          - 'branch-lane'

    - task_type: 'commit_preparation'
      description: 'Plan atomic commits or execute exact Git operations already authorized'
      skills:
          - 'commit-planner'

    - task_type: 'git_cleanup'
      description: 'Explicit stash/branch cleanup request; no automatic cleanup during normal work'
      skills:
          - 'git-stash-branch-cleanup'

    - task_type: 'invitation_preparation'
      description: 'Prepare a real invitation or assess intake completeness before implementation'
      skills:
          - 'client-invitation-audit'
          - 'invitation-preparation'
      docs:
          - 'docs/core/invitation-preparation-contract.md'

    - task_type: 'invitation_publication'
      description: 'Publishing or managed lifecycle changes for client invitations'
      rules:
          - '.agent/rules/invitation-production.md'
          - '.agent/rules/intake-publishing.md'
      docs:
          - 'docs/core/invitation-creation-contract.md'
          - 'docs/domains/intake/production-flow.md'
          - 'docs/core/content-parity-rsvp-isolation.md'
          - 'docs/domains/database/cheatsheets/README.md'

    - task_type: 'staged_code_review'
      description: 'Requested read-only review of staged changes'
      skills:
          - 'staged-code-review'

    - task_type: 'staged_code_review_apply'
      description: 'Apply an existing staged review finding set with explicit task authorization'
      skills:
          - 'staged-code-review-apply'

    - task_type: 'role_delegation'
      description: 'Assign bounded work to roles when delegation has independent value'
      rules:
          - '.agent/rules/agent-routing.md'

    - task_type: 'graphify_audit'
      description: 'Optional coupling audit where Graphify adds value; never a default codebase query'
      rules:
          - '.agent/rules/graphify-ops.md'

    - task_type: 'planning'
      description: 'Task planning, multi-session continuity, or goal sequencing'
      rules:
          - '.agent/rules/workflow.md'
      skills:
          - 'plan-authoring'
      docs:
          - '.agent/plans/README.md'
