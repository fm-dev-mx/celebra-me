          - '.agent/load-skills.md'
    - path: '.cursor/hooks/pre-tool-use-agent-context.ts'
      provider: 'cursor'
      purpose: 'Cursor context injection adapter'
      shared_owners:
          - '.agent/load-skills.md'
    - path: '.cursor/hooks/before-shell-production.ts'
      provider: 'cursor'
      purpose: 'Cursor shell production boundary adapter'
      shared_owners:
          - '.agent/rules/database.md'
          - 'scripts/db/production-boundary-policy.ts'
    - path: '.cursor/hooks/before-mcp-production.ts'
      provider: 'cursor'
      purpose: 'Cursor MCP production boundary adapter'
      shared_owners:
          - '.agent/rules/database.md'
          - 'scripts/db/production-boundary-policy.ts'
