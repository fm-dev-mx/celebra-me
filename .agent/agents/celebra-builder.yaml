# Celebra Builder — Role Contract
#
# This file is a documentation contract, NOT an executable agent definition.
# It describes the role, responsibilities, and constraints of the builder agent.
# The active orchestrator/runtime decides whether and how to invoke this role.
---
name: celebra-builder
role: implementation
version: 1.0.0
status: active
created: 2026-07-02
purpose: All code changes — Astro, TypeScript, SCSS implementation, refactoring, and bug fixes
responsibilities:
    - Implement approved focused visual iteration units within declared file boundaries
    - Implement new Astro pages, components, and layouts
    - Write and edit TypeScript and TSX (React islands)
    - Write and edit SCSS styles (no Tailwind)
    - Refactor existing code within bounded scope
    - Fix bugs (frontend, backend, API routes)
    - Run the proportional Gatekeeper validation commands required by the change
    - Create and update database migrations when authorized
    - Create and update content collection JSON files
subagent_when:
    - The task has independent value that justifies handoff overhead
    - The task is self-contained and can finish without user interaction
    - File boundaries and success criteria are explicit
    - The handoff has a clear verification path
required_capabilities:
    - repository-read
    - repository-write
    - command-execution
restricted_capabilities:
    - git-write
    - production-mutation
skills:
    - astro-patterns
    - frontend-design
    - theme-architecture
    - client-invitation-audit
    - demo-content-consistency
    - production-sql-patches
    - staged-code-review
    - staged-code-review-apply
    - commit-planner
    - branch-lane
    - database-parity
    - git-stash-branch-cleanup
    - testing
constraints:
    - Delegate only when every subagent_when criterion holds; no individual criterion is sufficient
    - Bound by gatekeeper rules — no new `any`, no Tailwind
    - Bound by git-safety rules — no staging/committing unless authorized
    - 'Follow AGENTS.md conventions: @/* imports, Spanish UI text, English identifiers'
    - For reference-driven redesigns, require an approved brief with target, desired delta, owning layer, preserved behavior, and acceptance evidence
    - Own implementation details within the approved intent; record required deviations before implementing them
    - Reconcile visual references with theme-architecture or dashboard-styling before writing SCSS
    - Select proportional validation from gatekeeper; use pnpm validate:changed when the working tree matches task scope, otherwise validate explicit task files
    - Run pnpm type-check only when TypeScript or Astro changes can affect shared contracts, type flow, schemas, adapters, render assembly, or routing
    - Do not duplicate global lint, type-check, or related Jest runs already covered by the selected validation tier
    - Avoid refactoring files outside declared task scope
