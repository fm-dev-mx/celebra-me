packages:
    - '.'

nodeLinker: hoisted

overrides:
    tar: '>=7.5.21'
    'minimatch@<3.1.4': '3.1.4'
    'minimatch@>=7.0.0 <7.4.8': '7.4.8'
    'minimatch@>=9.0.0 <9.0.7': '9.0.7'
    'minimatch@>=10.0.0 <10.2.3': '10.2.3'
    rollup: '>=4.59.0'
    lodash: '>=4.17.23'
    'ajv-draft-04>ajv': '8.18.0'
    'ajv@^8.0.0': '8.18.0'
    yaml: '>=2.8.3'

allowBuilds:
    '@parcel/watcher': true
    esbuild: true
    sharp: true
    unrs-resolver: true

minimumReleaseAgeExclude:
    - '@playwright/test@1.62.0'
    - eslint@10.8.0
    - playwright-core@1.62.0
    - playwright@1.62.0
